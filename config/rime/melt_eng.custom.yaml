# Ubuntu 22.04 librime 1.7 compatibility: retain native pinyin and dictionaries.
patch:
  engine/processors:
  - ascii_composer
  - key_binder
  - speller
  - recognizer
  - selector
  - navigator
  - express_editor
  engine/segmentors:
  - matcher
  - ascii_segmentor
  - abc_segmentor
  - punct_segmentor
  - fallback_segmentor
  engine/translators:
  - table_translator
  - punct_translator
  engine/filters:
  - uniquifier
